apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deploy
  namespace: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: bheidari3/clo835-app:latest
        env:
        - name: APP_COLOR
          value: "blue"
        - name: DB_HOST
          value: mysql
        - name: DB_USER
          value: app
        - name: DB_PASSWORD
          value: apppass
        - name: DB_NAME
          value: appdb
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30001
